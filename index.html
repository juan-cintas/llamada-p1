<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Llamada P1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
  /* Layout: one full-screen phone call card, centered; the video takes over the whole screen on tap. Single dark look by design. */
  :root {
    --bg: #07080b;
    --bg-2: #12141b;
    --fg: #eef0f4;
    --muted: #8d93a3;
    --danger: #e5333b;
    --ok: #22b357;
    --accent: #ff7a1a;
    --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg) 70%) fixed, var(--bg);
    color: var(--fg);
    font-family: var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .call {
    width: 100%;
    max-width: 380px;
    min-height: min(92%, 720px);
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 24px;
    text-align: center;
    padding-block: 32px 40px;
  }
  .top { display: grid; gap: 6px; }
  .label { color: var(--muted); font-size: 0.95rem; letter-spacing: 0.04em; }
  .caller { display: grid; gap: 14px; align-content: center; justify-items: center; }
  .avatar {
    width: 112px; height: 112px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--bg-2);
    border: 1px solid #262a35;
    font-size: 2.6rem; font-weight: 800; color: var(--danger);
    position: relative;
  }
  .avatar::after {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    border: 2px solid var(--danger); opacity: 0.6;
    animation: ring 1.4s ease-out infinite;
  }
  @keyframes ring { from { transform: scale(0.9); opacity: 0.7 } to { transform: scale(1.35); opacity: 0 } }
  h1 { margin: 0; font-size: 2rem; font-weight: 800; line-height: 1.15; text-wrap: balance; }
  .sub { color: var(--muted); margin: 0; font-size: 1rem; }
  .actions { display: flex; justify-content: space-around; gap: 24px; }
  .btn {
    display: grid; gap: 10px; justify-items: center;
    background: none; border: 0; color: var(--fg); font: inherit; font-size: 0.95rem; cursor: pointer;
  }
  .btn span.circle {
    width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center;
  }
  .btn svg { width: 32px; height: 32px; fill: #fff; }
  .reject .circle { background: var(--danger); }
  .accept .circle { background: var(--ok); animation: bob 1s ease-in-out infinite; }
  .reject svg { transform: rotate(135deg); }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  .btn:focus-visible .circle { outline: 3px solid var(--fg); outline-offset: 4px; }
  .stage {
    position: fixed; inset: 0; background: #000; z-index: 20;
    display: grid; place-items: center;
  }
  .stage video { width: 100%; height: 100%; object-fit: cover; }
  .stage .tap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .end {
    position: fixed; inset: 0; z-index: 30; background: var(--bg);
    display: grid; place-items: center; text-align: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .end .box { display: grid; gap: 18px; justify-items: center; }
  .end h2 { margin: 0; font-size: 2.2rem; font-weight: 800; color: var(--accent); text-wrap: balance; }
  .end p { margin: 0; color: var(--muted); }
  .again {
    font: inherit; font-weight: 600; color: var(--fg); background: var(--bg-2);
    border: 1px solid #2b303c; border-radius: 999px; padding: 12px 22px; cursor: pointer;
  }
  .again:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .avatar::after, .accept .circle { animation: none; }
  }
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<main class="call" id="call">
  <div class="top">
    <span class="label">Llamada entrante</span>
  </div>
  <div class="caller">
    <div class="avatar" aria-hidden="true">P1</div>
    <h1>Servicio crítico de CLIENTE</h1>
    <p class="sub">Prioridad 1 · SLA vencido</p>
  </div>
  <div class="actions">
    <button class="btn reject" id="reject" type="button">
      <span class="circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></span>
      Rechazar
    </button>
    <button class="btn accept" id="accept" type="button">
      <span class="circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></span>
      Aceptar
    </button>
  </div>
</main>

<div class="stage" id="stage" hidden>
  <video id="vid" playsinline webkit-playsinline preload="auto"></video>
  <button class="again tap" id="tap" type="button" hidden>Toca para conectar</button>
</div>

<div class="end" id="end" hidden>
  <div class="box">
    <h2>Feliz Halloween</h2>
    <p>La P1 sigue abierta.</p>
    <button class="again" id="again" type="button">Volver a ver</button>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');
  const vid = document.getElementById('vid');
  const end = document.getElementById('end');
  const tap = document.getElementById('tap');
  let ready = false, pending = false;

  // Load the video as a blob so it plays inside the artifact frame
  fetch('susto.mp4')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then(b => {
      const blob = new Blob([b], { type: 'video/mp4' });
      // If the frame refuses blob: media, fall back to a data: URL of the same file
      vid.addEventListener('error', function once() {
        vid.removeEventListener('error', once);
        const fr = new FileReader();
        fr.onload = () => { vid.src = fr.result; vid.load(); if (!stage.hidden) tap.hidden = false; };
        fr.readAsDataURL(blob);
      });
      vid.src = URL.createObjectURL(blob);
      vid.load();
      ready = true;
      if (pending) start();
    })
    .catch(() => { vid.src = 'susto.mp4'; ready = true; if (pending) start(); });

  function start() {
    end.hidden = true;
    stage.hidden = false;
    vid.currentTime = 0;
    vid.muted = false;
    vid.volume = 1;
    const p = vid.play();
    if (p && p.catch) p.catch(() => { tap.hidden = false; });
  }
  function play() {
    if (!ready) { pending = true; stage.hidden = false; return; }
    start();
  }
  tap.addEventListener('click', () => { tap.hidden = true; vid.muted = false; vid.play().catch(() => { vid.controls = true; }); });
  document.getElementById('accept').addEventListener('click', play);
  document.getElementById('reject').addEventListener('click', play);
  document.getElementById('again').addEventListener('click', play);
  vid.addEventListener('ended', () => {
    try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {}
    stage.hidden = true;
    end.hidden = false;
  });
</script>

</body>
</html>
